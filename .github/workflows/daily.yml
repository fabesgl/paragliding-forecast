name: Daily update
on:
  schedule:
    # Open-Meteo has the 12Z runs (ECMWF ~19:20Z, GFS ~20:20Z, ICON ~15:30Z) and the 00Z runs (ECMWF ~07:20Z, GFS ~08:20Z, ICON ~03:30Z)
    # about that long after they start, so run shortly after: morning 20:45 UTC = 7:45am AEDT, evening 08:45 UTC = 7:45pm AEDT.
    # The job also waits (up to 75 min) for the newest runs if Open-Meteo is late. Times shift 1 h earlier in winter (AEST).
    - cron: "45 20 * * *"
    - cron: "45 8 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write                  # lets the job open one issue when the valley-wind calibration is ready
concurrency: daily-update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main            # always start from the newest main (not the commit the run was triggered from), so a run queued behind another one sees its commit
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Install LightGBM for Creo shadow mode (if this fails the job carries on without it)
        continue-on-error: true
        run: pip install -r requirements-creo.txt
      - name: Collect BOM observations
        id: bom
        continue-on-error: true
        run: python scripts/collect_bom.py bright
      - name: Check the saved observations for gaps (report only)
        continue-on-error: true
        run: python scripts/check_observations.py bright
      - name: Update bias corrections (forecasts vs BOM observations)
        run: python scripts/update_corrections.py bright
      - name: Weighting review (equal vs weighted models against BOM stations; opens one issue after 30 days)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/weighting_review.py bright
      - name: Valley-wind calibration check (reports only, never changes the rules)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/calibrate_valley_wind.py bright
      - name: Wait for the newest ECMWF, GFS and ICON runs
        run: python scripts/wait_for_models.py
      - name: Fetch forecasts, score, build dashboard
        id: fc
        continue-on-error: true
        env:
          MODEL_WEIGHTING: ${{ vars.MODEL_WEIGHTING }}         # set to equal in Settings > Variables to go back to the plain model average (empty = use model_weighting in sites/bright.yaml)
        run: python scripts/daily_forecast.py bright
      - name: Commit new data
        run: |
          git config user.name "daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add observations forecast_archive predictions model_runs corrections docs
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git pull --rebase -q && git push
      - name: Fail the run if a step failed
        if: steps.bom.outcome == 'failure' || steps.fc.outcome == 'failure'
        run: exit 1
