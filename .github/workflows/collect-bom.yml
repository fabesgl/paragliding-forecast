name: Collect BOM observations
on:
  schedule:
    - cron: "30 18 * * *"   # 18:30 UTC = 5:30am AEDT (6:30am AEST in winter)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: collect-bom
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/collect_bom.py bright
      - name: Commit new observations
        if: always()
        run: |
          git config user.name "bom-collector"
          git config user.email "actions@users.noreply.github.com"
          git add observations
          git diff --cached --quiet || git commit -m "BOM observations $(date -u +%F)"
          git pull --rebase -q && git push
