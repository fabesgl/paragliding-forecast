  - {start: 2024-02-10, end: 2024-02-16}
  - {start: 2025-02-09, end: 2025-02-15}
  - {start: 2026-01-16, end: 2026-01-23}

# Training weight of distances flown in comp weeks (the task limits distance, not the weather). Flight counts on comp days get weight 0 and `flyable` is kept. A guess: change it if you like.
comp_distance_weight: 0.5
