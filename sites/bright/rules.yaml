# Flying rules for Mystic, Bright. Edit a number, save, and the next update uses it (no code changes needed).
#
# How a rule works: each rule turns one forecast number into a score from 0% to 100%.
#   limit      = the value the forecast should stay on the good side of. The score is about 90% when the forecast is exactly at it.
#   zero_at    = the value where the rule's score reaches 0%.
#   Between "comfortably fine" and zero_at the score falls smoothly (see "smoothing" below), so there is no cliff edge.
# A day's score is its WEAKEST rule: the worst rule sets the score (weakest link).
# Speeds are km/h, heights are metres above sea level (ASL) unless a name says otherwise. All values are averages over the models.
# Keep zero_at on the bad side of the limit (above it for "stay under" rules, below it for "stay over" rules) or the file will be rejected.

direction:                       # Is the wind blowing from a direction Mystic can launch in? Scored per hour (100%, 0%, or in between for a southerly), then averaged over the window.
  launch_arc_deg: [315, 45]      # Compass arc (from, to, clockwise) the 10 m wind must come from to launch: 315 = NW, through N, to 45 = NE.
  calm_below_kmh: 6              # Under this launch wind speed the direction is ignored (light and variable wind is fine from any side).
  unflyable_arc_deg: [135, 247]  # Compass arc of wind aloft that rules the day out: 135 = SE, through S, to 247 = SW.
  unflyable_min_850_kmh: 25      # The day is ruled out (0%) when the 850 hPa wind comes from the arc above AND is stronger than this. The valley wind below can NOT override this.
  southerly_launch:              # A southerly at launch (over calm_below_kmh) is still OK when the thermic valley wind, which blows from the north, is stronger than the southerly.
    arc_deg: [135, 247]          # Launch wind from this arc counts as a southerly: 135 = SE, through S, to 247 = SW.
    valley_wind_kmh_per_thermal_ms: 6   # Estimated valley wind (km/h) for each 1 m/s of estimated thermal strength. A DEFAULT, to be calibrated from observations (see calibrate_valley_wind.py).
    fade_kmh: 3                  # Fade width (km/h): 100% when the valley wind beats the southerly by this much or more, 0% when it falls short by this much, 50% when equal.

shared:                          # Rules that apply to BOTH XC and acro.
  rain:                          # Rain in the flying window (total over the window, millimetres). No rain scores 100%; the score eases to about 90% at limit_mm, then falls to 0%.
    limit_mm: 0.2                # Rain at or above this counts as "rain forecast" (also the AI second opinion's hard limit).
    zero_at_mm: 2.0              # Score reaches 0% at this much rain.
  cape:                          # CAPE = energy for storms. High CAPE means overdevelopment (thunderstorm) risk.
    limit: 800                   # Comfortable up to about this CAPE (J/kg).
    zero_at: 1800                # Score reaches 0% at this CAPE.

xc:                              # Cross-country rules. XC needs light wind, a high ceiling and decent thermals.
  launch_wind:                   # Average 10 m wind at launch over the flying window.
    limit_kmh: 20                # Want launch wind under this. Also the AI second opinion's hard limit for XC.
    zero_at_kmh: 32              # Score reaches 0% at this wind speed.
  gusts:                         # Strongest gust forecast in the flying window.
    limit_kmh: 25                # Want gusts under this. Also the AI second opinion's hard limit for XC.
    zero_at_kmh: 40              # Score reaches 0% at this gust speed.
  wind_850:                      # Wind at 850 hPa (about 1,500 m up).
    limit_kmh: 25                # Want the 850 hPa wind under this. Also the AI second opinion's hard limit for XC.
    zero_at_kmh: 45              # Score reaches 0% at this speed.
  ceiling:                       # How high you can climb: cloud base, or the top of dry thermals if that is lower.
    min_asl_m: 2000              # Want the ceiling above this height (ASL).
    zero_at_asl_m: 1300          # Score reaches 0% when the ceiling is this low.
  thermals:                      # Estimated average climb rate (from sunshine and boundary-layer depth, not a direct forecast).
    min_ms: 1.5                  # Want thermals at least this strong (metres per second).
    zero_at_ms: 0.5              # Score reaches 0% at this climb rate.

acro:                            # Acro rules. Acro needs smooth, steady air and wind aloft that keeps you over the acro box (north side of Mystic). Local knowledge: see notes.md.
  launch_wind:                   # Average 10 m wind at launch over the flying window.
    limit_kmh: 15                # Want launch wind under this. Also the AI second opinion's hard limit for acro.
    zero_at_kmh: 25              # Score reaches 0% at this wind speed.
  gusts:                         # Strongest gust forecast in the flying window.
    limit_kmh: 20                # Want gusts under this. Also the AI second opinion's hard limit for acro.
    zero_at_kmh: 32              # Score reaches 0% at this gust speed.
  wind_850:                      # Wind at 850 hPa (about 1,500 m up).
    limit_kmh: 20                # Want the 850 hPa wind under this. Also the AI second opinion's hard limit for acro.
    zero_at_kmh: 38              # Score reaches 0% at this speed.
  shear:                         # Wind shear = how much the wind changes between launch and 850 hPa (a turbulence signal).
    limit_kmh: 15                # Want the wind difference between launch height and 850 hPa under this.
    zero_at_kmh: 35              # Score reaches 0% at this difference.
  aloft:                         # The "acro height" wind: where pilots climb in thermals and fly into the box to do acro (about 1,000-2,000 m up).
    levels_hpa: [900, 850, 800]  # Pressure levels averaged for that wind: 900 = about 1,000 m, 850 = about 1,500 m, 800 = about 2,000 m (ASL).
  northerly_aloft:               # Wind from the north at acro height drifts you back towards the hill, so you cannot train as low. A MILD penalty, never a no-go.
    limit_kmh: 5                 # Northerly wind (km/h, the part of the wind blowing towards the south) up to this costs nothing.
    strong_kmh: 20               # Northerly wind at or above this gets the full penalty.
    max_penalty: 0.30            # Biggest score loss from this rule alone (0.30 = -30%), reached in strong northerly with low climbs. It can never reach 0%.
    low_climb_above_launch_m: 600   # Climbs reaching only this far above launch (or less) get the full penalty: little working height to spare.
    high_climb_above_launch_m: 1800 # Climbs reaching this far above launch (or more) get the smallest penalty: plenty of height to train higher.
    penalty_share_when_high: 0.33   # Share of the penalty kept when climbs are high (0.33 = a third, so at most about -10%).
  westerly_aloft:                # Westerly wind at acro height brings turbulence off Mt Buffalo (roughly WNW of Mystic). Flyable but rough: a clear penalty, not a no-go.
    weights: {WSW: 0.5, W: 1.0, WNW: 1.0}   # How much each wind-from direction counts (0 to 1). Other compass points count 0; weights blend smoothly between points. Launch wind is NOT counted.
    limit_kmh: 8                 # Weighted westerly wind aloft (km/h) up to this costs nothing.
    zero_at_kmh: 25              # The penalty is at its deepest (the floor below) from this weighted speed.
    floor: 0.30                  # Lowest this rule can score (0.30 = 30%): rough, but never a no-go on its own.
  strong_thermals:               # Smooth air between thermals is ideal for acro. Thermic air is fine, but very strong or rough thermals are not as good. Mild penalty.
    limit_ms: 2.5                # Estimated climb rate (m/s) up to this costs nothing.
    zero_at_ms: 4.0              # The penalty is at its deepest from this climb rate.
    floor: 0.60                  # Lowest this rule can score (0.60 = 60%): mild, never a no-go.
  height:                        # More height is better. Days where climbs stay low score down.
    min_above_launch_m: 1400     # Want the thermal top / cloud base at least this far above launch (about 2,200 m ASL at Mystic).
    zero_at_above_launch_m: 400  # Score reaches 0% when climbs reach only this far above launch.

smoothing:                       # How gently a rule's score fades from 100% to 0%.
  full_score_margin: 0.25        # The score stays 100% until the forecast is this fraction of the limit-to-zero distance on the good side of the limit.
                                 # Bigger = a wider fade (a gentler slope that starts earlier); 0 = starts fading right at the limit.

estimates:                       # Rough rules of thumb used to turn forecast numbers into cloud base and thermal strength.
  cloud_base_m_per_degC: 125     # Cloud base height above ground = this x (air temperature minus dew point).
  thermal_heat_fraction: 0.3     # Share of the sunshine forecast (W/m2) assumed to heat the air as thermals.
  thermal_climb_fraction: 0.7    # Typical glider climb as a share of the thermal's peak updraft (Deardorff w*).
  thermal_depth_cap_m: 2500      # If a model gives no boundary-layer height, assume thermals reach cloud base, but no higher than this above ground.

ratings:                         # How a percentage becomes a Good / Marginal / Poor label on the page and in the logs.
  good_min_pct: 65               # This score or higher = Good.
  marginal_min_pct: 35           # This score or higher (and under Good) = Marginal. Under it = Poor.
  pulled_down_below: 0.9         # A rule counts as "pulling the score down" (shown on the page) when its score is under this (0.9 = under 90%).
